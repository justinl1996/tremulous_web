//Example Tremulous 1.1 decicated server config
set sv_pure 1

//passwords
set g_needpass 0
//set g_password password   //server password
//set rconPassword password //rcon password

//loading screen
set sv_hostname "EU Server"
set g_motd "Bots fill empty slots and leave as players join"

//disallow downloads from the server
set sv_allowdownload 0

//maximum number of clients, bots use these slots too
//leave room for bot_minplayers bots on each team plus real players
set sv_maxclients 16
set sv_privateClients 0

//after 50 minutes, all build points are removed
set g_suddenDeathTime 50
//after 60 minutes, the game will end as a draw
set timelimit 60

//forces each team to have a similar number of players
set g_teamForceBalance 1

//kick idle players, bots are never kicked
set g_inactivity 300

//bots
//keep at least this many players on each team, bots fill the gaps and
//leave again as real players join (0 disables)
set bot_minplayers 4
//skill of bots added by bot_minplayers or addbot without a skill (1-5)
set bot_skill 3
//skill levels taken off human bots' aim and reaction against real players,
//bot against bot is unaffected so the teams stay balanced (0-10, 0 disables)
set bot_humanAimHandicap 7
//msec per server frame spent building the bot navigation graph
set bot_navBudget 5
//bots on each team that build and repair the base instead of fighting (0 disables)
set bot_builders 1

//following the first map, start this rotation
set g_initialMapRotation allmaps

//misc settings
set pmove_fixed     0
set sv_minRate      5000
set sv_maxRate      15000
set sv_minSnaps     10

//start this map first
map atcs

//to add specific bots instead of (or as well as) bot_minplayers, use these
//once the map has loaded, from the server console or with /rcon:
//  addbot Ripley humans 4
//  addbot aliens 2
//  kickbots aliens
